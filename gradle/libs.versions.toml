[versions]
coreKtx = "1.15.0"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.10.01"
navigationCompose = "2.8.3"
coil = "2.7.0"
materialIconExtended = "1.7.4"
retrofit2 = "3.14.9"
okhttp = "5.0.0-alpha.11"
datastore = "1.1.1"
splashScreen = "1.0.1"
hilt = "2.49"
hiltWork = "1.2.0"
espressoCore = "3.6.1"
junit = "4.13.2"
junitVersion = "1.2.1"

# for plugin
ksp = "2.0.10-1.0.24"
kotlin = "2.0.10"
agp = "8.5.2"

[libraries]
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose", name = "ui" }
compose-ui-graphics = { group = "androidx.compose", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose", name = "ui-tooling-preview" }
compose-ui-test-manifest = { group = "androidx.compose", name = "ui-test-manifest" }
